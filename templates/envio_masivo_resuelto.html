<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Envío Masivo - Panel Control ISP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #121212 !important; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border-color: #2c2c2c; }
        .table { color: #e0e0e0; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fab fa-whatsapp text-success"></i> Lista de Envíos Masivos Preparados</h2>
            <a href="/panel" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left"></i> Volver al Panel</a>
        </div>

        <div class="alert alert-info" role="alert">
            <strong>Mensaje configurado:</strong> <br>
            <em>"{{ mensaje }}"</em>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Cliente</th>
                                <th>Teléfono</th>
                                <th>Estado Pago</th>
                                <th class="text-center">Acción de Envío</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for c in clientes %}
                            {% if c.telefono %}
                            <tr>
                                <td><strong>{{ c.nombre }} {{ c.apellido }}</strong></td>
                                <td>{{ c.telefono }}</td>
                                <td>
                                    <span class="badge {% if 'Pagado' in c.estado_pago %}bg-success{% else %}bg-warning text-dark{% endif %}">
                                        {{ c.estado_pago }}
                                    </span>
                                </td>
                                <td class="text-center">
                                    <a href="https://wa.me/{{ c.telefono }}?text={{ mensaje | urlencode }}" 
                                       target="_blank" class="btn btn-success btn-sm">
                                        <i class="fab fa-whatsapp"></i> Enviar Mensaje
                                    </a>
                                </td>
                            </tr>
                            {% endif %}
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
