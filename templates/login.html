<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Acceso - ISP Control Central</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) !important; 
            margin: 0 !important; 
            height: 100vh !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            overflow: hidden !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
        }

        /* ESCUDO TOTAL: Pantalla de carga inicial */
        #pantalla-carga {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background-color: #0f172a !important;
            z-index: 999999999 !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
        }

        .logo-contenedor {
            width: 100% !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            margin-bottom: 0 !important;
        }

        .logo-contenedor img {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 85vh !important;
            object-fit: cover !important;
            object-position: center !important;
            border-radius: 15px !important;
            display: block !important;
        }

        /* Contenedor principal que une la tarjeta y el texto lateral/descriptivo */
        .login-wrapper {
            display: flex;
            align-items: center;
            gap: 40px;
            max-width: 900px;
            width: 90%;
        }

        /* Texto de bienvenida al costado */
        .login-info {
            flex: 1;
            color: #fff;
            display: none;
        }

        @media (min-width: 768px) {
            .login-info {
                display: block;
            }
        }

        .login-info h1 {
            font-weight: 800;
            font-size: 2.5rem;
            color: #38bdf8;
            margin-bottom: 15px;
        }

        .login-info p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Tarjeta de Login con estilo Glassmorphism */
        .login-card { 
            width: 100%;
            max-width: 400px;
            padding: 30px !important; 
            background: rgba(255, 255, 255, 0.05) !important; 
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            border-radius: 20px !important; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4) !important;
            color: #fff !important;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.07) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #fff !important;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3) !important;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE CARGA INICIAL -->
    <div id="pantalla-carga">
        <div class="logo-contenedor">
            <img src="{{ url_for('static', filename='img/logo.jpeg')}}" alt="Logo">
        </div>
        <h2 style="color: white !important; font-size: 24px !important; font-family: sans-serif !important; margin-top: 15px !important;">Iniciando sistema...</h2>
    </div>

    <!-- CONTENIDO DEL LOGIN -->
    <div class="login-wrapper">
        <div class="login-info">
            <div class="mb-3 text-info">
                <i class="fas fa-network-wired fa-3x"></i>
            </div>
            <h1>ISP Control Central</h1>
            <p>Gestioná todas tus redes, nodos y clientes desde un solo panel de control inteligente y en tiempo real.</p>
            <div class="mt-4 text-muted small">
                <i class="fas fa-shield-alt text-success me-1"></i> Desarrollado por Arquitectura MBC
            </div>
        </div>

        <div class="login-card shadow-lg">
            <div class="text-center mb-4">
                <h4 class="fw-bold text-uppercase tracking-wide text-info mb-1">Iniciar Sesión</h4>
                <p class="text-muted small m-0">Ingresá tus credenciales</p>
            </div>
            
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted small"><i class="fas fa-user me-1"></i> Usuario</label>
                    <input type="text" name="username" class="form-control" required placeholder="Usuario">
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted small"><i class="fas fa-lock me-1"></i> Contraseña</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-info w-100 fw-bold py-2 text-dark shadow">
                    <i class="fas fa-sign-in-alt me-2"></i> Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE TRANSICIÓN -->
    <script>
        setTimeout(function() {
            const loader = document.getElementById('pantalla-carga');
            if (loader) {
                loader.style.transition = 'opacity 0.8s ease';
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.remove();
                    document.body.style.overflow = 'auto';
                }, 800);
            }
        }, 2000);
    </script>

</body>
</html>
