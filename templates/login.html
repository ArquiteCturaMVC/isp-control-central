<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Panel - ISP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { width: 350px; padding: 20px; background-color: #1e1e1e; border: 1px solid #333; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="login-card shadow">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        <form method="POST">
            <div class="mb-3">
                <label>Usuario</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-info w-100">Entrar</button>
        </form>
    </div>
</body>
</html>
